<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy : livrée en meta (pas en en-tête HTTP) pour que
         le service worker la versionne avec le contenu de la page. Un changement
         de CSP modifie le hash de index.html, donc le SW recharge et propage. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://apis.google.com https://img.youtube.com https://*.ytimg.com; img-src 'self' data: blob: https://*.ytimg.com https://img.youtube.com https://*.googleusercontent.com https://yt3.ggpht.com; font-src 'self' data:; frame-src https://accounts.google.com https://www.youtube.com https://youtube.com; object-src 'none'; base-uri 'self'" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TubiScope</title>
    
    <meta name="theme-color" content="#0a0f1c" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TubiScope" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
